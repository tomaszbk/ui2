name: Adaptive layout tests

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'ide/**'
      - 'thirdparty/vglyph/**'
      - 'assets/fonts/**'
      - '.github/actions/setup-v/**'
      - '.github/workflows/adaptive-layout.yml'
  push:
    branches: [master, work/ide-adaptive-layout]
    paths:
      - 'ui/**'
      - 'ide/**'
      - 'thirdparty/vglyph/**'
      - 'assets/fonts/**'
      - '.github/actions/setup-v/**'
      - '.github/workflows/adaptive-layout.yml'

permissions:
  contents: read

concurrency:
  group: adaptive-layout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VJOBS: '1'
    steps:
      # The checkout directory name is used to resolve `import ui2`.
      - uses: actions/checkout@v4
        with:
          path: ui2
          persist-credentials: false

      - name: Install Linux development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxfixes-dev libgl1-mesa-dev libegl-dev libasound2-dev \
            pkg-config libpango1.0-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libfontconfig1-dev fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      - name: Set up verified V
        uses: ./ui2/.github/actions/setup-v
        with:
          c-compiler: gcc
          tcc-revision: d6e7ac1b1bcc98aed734a6ecbfa8509f24606c74

      - name: Verify custom text dependencies
        run: |
          text_modules='pango pangoft2 freetype2 harfbuzz fribidi fontconfig gobject-2.0 glib-2.0'
          pkg-config --exists $text_modules
          pkg-config --atleast-version=1.50 pango
          pkg-config --modversion $text_modules

      - name: Check the IDE
        run: v -cc gcc -check ui2/ide

      - name: Test layout geometry
        run: v -cc gcc test ui2/ui/adaptive_layout_test.v

      - name: Test adaptive VML
        run: v -cc gcc test ui2/ui/vml_adaptive_test.v

      - name: Test designer and generated companion
        run: v -cc gcc test ui2/ide
