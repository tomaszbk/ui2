name: Set up the verified V compiler
description: Bootstrap pinned V and vc sources with the system C compiler

inputs:
  c-compiler:
    description: System C compiler used for the bootstrap
    required: true
  v-repository:
    description: Repository containing the compiler; empty reads scripts/v-pin.env
    default: ''
  v-revision:
    description: V source revision; empty reads scripts/v-pin.env
    default: ''
  vc-revision:
    description: Generated C bootstrap snapshot; empty reads scripts/v-pin.env
    default: ''
  tcc-revision:
    description: Platform bundle supplying V's default Boehm GC library; empty reads scripts/v-pin.env
    default: ''

runs:
  using: composite
  steps:
    # scripts/v-pin.env is the single source of the compiler pin; the action's
    # inputs only override it.
    - name: Resolve compiler pin
      id: pin
      shell: bash
      env:
        IN_V_REPOSITORY: ${{ inputs.v-repository }}
        IN_V_REVISION: ${{ inputs.v-revision }}
        IN_VC_REVISION: ${{ inputs.vc-revision }}
        IN_TCC_REVISION: ${{ inputs.tcc-revision }}
      run: |
        set -eu
        . "${{ github.action_path }}/../../../scripts/v-pin.env"
        case "${{ runner.os }}" in
          Linux) tcc=$TCC_REVISION_LINUX ;;
          macOS) tcc=$TCC_REVISION_MACOS ;;
          Windows) tcc=$TCC_REVISION_WINDOWS ;;
        esac
        {
          echo "v-repository=${IN_V_REPOSITORY:-$V_REPOSITORY}"
          echo "v-revision=${IN_V_REVISION:-$V_REVISION}"
          echo "vc-revision=${IN_VC_REVISION:-$VC_REVISION}"
          echo "tcc-revision=${IN_TCC_REVISION:-$tcc}"
        } >> "$GITHUB_OUTPUT"

    - name: Check out pinned V sources
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.pin.outputs.v-repository }}
        ref: ${{ steps.pin.outputs.v-revision }}
        path: v-toolchain
        persist-credentials: false

    - name: Check out pinned V bootstrap
      uses: actions/checkout@v4
      with:
        repository: vlang/vc
        ref: ${{ steps.pin.outputs.vc-revision }}
        path: v-toolchain/vc
        persist-credentials: false

    - name: Check out pinned V runtime bundle
      uses: actions/checkout@v4
      with:
        repository: vlang/tccbin
        ref: ${{ steps.pin.outputs.tcc-revision }}
        path: v-toolchain/thirdparty/tcc
        persist-credentials: false

    # Match upstream's compiler bootstrap. `-gc none` applies only to building
    # V itself; UI2 tests and examples continue to use V's default GC.
    - name: Bootstrap V on Unix
      if: runner.os != 'Windows'
      shell: bash
      working-directory: ${{ github.workspace }}/v-toolchain
      env:
        BOOTSTRAP_CC: ${{ inputs.c-compiler }}
      run: |
        set -eu
        git rev-parse HEAD
        git -C vc rev-parse HEAD
        git -C thirdparty/tcc rev-parse HEAD
        "$BOOTSTRAP_CC" -DCUSTOM_DEFINE_v1_fallback -std=c99 -w -o v1 vc/v.c -lm -lpthread
        ./v1 -b c -no-parallel -cc "$BOOTSTRAP_CC" -o v2 -gc none cmd/v
        ./v2 -b c -nocache -cc "$BOOTSTRAP_CC" -o v -gc none cmd/v
        rm -f v1 v2
        echo "$PWD" >> "$GITHUB_PATH"
        ./v version

    - name: Bootstrap V on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ github.workspace }}/v-toolchain
      env:
        BOOTSTRAP_CC: ${{ inputs.c-compiler }}
      run: |
        $ErrorActionPreference = 'Stop'
        git rev-parse HEAD
        git -C vc rev-parse HEAD
        git -C thirdparty/tcc rev-parse HEAD
        & $env:BOOTSTRAP_CC -DCUSTOM_DEFINE_v1_fallback -std=c99 -municode -w -o v1.exe vc/v_win.c -ladvapi32 -lws2_32 -lbcrypt '-Wl,-stack=33554432'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & .\v1.exe -b c -no-parallel -cc $env:BOOTSTRAP_CC -o v2.exe -gc none cmd/v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & .\v2.exe -b c -nocache -cc $env:BOOTSTRAP_CC -o v.exe -gc none cmd/v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item v1.exe, v2.exe
        (Get-Location).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & .\v.exe version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
