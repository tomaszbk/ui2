name: Set up the verified V compiler
description: Bootstrap pinned V and vc sources with the system C compiler

inputs:
  c-compiler:
    description: System C compiler used for the bootstrap
    required: true
  v-revision:
    description: Verified V source revision
    default: 3005dc383743bb2e2b3642f44307b6e75e7b37e3
  vc-revision:
    description: Compatible generated C bootstrap snapshot
    default: 8af812feb76c678abd86a8e682fd9ab2790e519c
  tcc-revision:
    description: Platform bundle supplying V's default Boehm GC library
    required: true

runs:
  using: composite
  steps:
    - name: Check out pinned V sources
      uses: actions/checkout@v4
      with:
        repository: vlang/v
        ref: ${{ inputs.v-revision }}
        path: v-toolchain
        persist-credentials: false

    - name: Check out pinned V bootstrap
      uses: actions/checkout@v4
      with:
        repository: vlang/vc
        ref: ${{ inputs.vc-revision }}
        path: v-toolchain/vc
        persist-credentials: false

    - name: Check out pinned V runtime bundle
      uses: actions/checkout@v4
      with:
        repository: vlang/tccbin
        ref: ${{ inputs.tcc-revision }}
        path: v-toolchain/thirdparty/tcc
        persist-credentials: false

    # Match upstream's compiler bootstrap. `-gc none` applies only to building
    # V itself; UI2 tests and examples continue to use V's default GC.
    - name: Bootstrap V on Unix
      if: runner.os != 'Windows'
      shell: bash
      working-directory: ${{ github.workspace }}/v-toolchain
      env:
        BOOTSTRAP_CC: ${{ inputs.c-compiler }}
      run: |
        set -eu
        git rev-parse HEAD
        git -C vc rev-parse HEAD
        git -C thirdparty/tcc rev-parse HEAD
        "$BOOTSTRAP_CC" -DCUSTOM_DEFINE_v1_fallback -std=c99 -w -o v1 vc/v.c -lm -lpthread
        ./v1 -no-parallel -cc "$BOOTSTRAP_CC" -o v2 -gc none cmd/v
        ./v2 -nocache -cc "$BOOTSTRAP_CC" -o v -gc none cmd/v
        rm -f v1 v2
        echo "$PWD" >> "$GITHUB_PATH"
        ./v version

    - name: Bootstrap V on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ github.workspace }}/v-toolchain
      env:
        BOOTSTRAP_CC: ${{ inputs.c-compiler }}
      run: |
        $ErrorActionPreference = 'Stop'
        git rev-parse HEAD
        git -C vc rev-parse HEAD
        git -C thirdparty/tcc rev-parse HEAD
        & $env:BOOTSTRAP_CC -DCUSTOM_DEFINE_v1_fallback -std=c99 -municode -w -o v1.exe vc/v_win.c -ladvapi32 -lws2_32 -lbcrypt '-Wl,-stack=33554432'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & .\v1.exe -no-parallel -cc $env:BOOTSTRAP_CC -o v2.exe -gc none cmd/v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & .\v2.exe -nocache -cc $env:BOOTSTRAP_CC -o v.exe -gc none cmd/v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item v1.exe, v2.exe
        (Get-Location).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & .\v.exe version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
